<!DOCTYPE html> 
<html lang="id"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>LBS 2026 Project</title> 
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap'); 
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap'); 
 
        :root { 
            --cold-main: #5e81ac; 
            --cold-soft: #88c0d0; 
            --blue-deep: #2e3440; 
            --mist-white: #eceff4; 
            --dark-text: #eceff4; 
            --glass-bg: rgba(46, 52, 64, 0.6); 
            --glass-border: rgba(136, 192, 208, 0.2); 
        } 
 
        * { box-sizing: border-box; } 
 
        body { 
            font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            min-height: 100vh; 
            /* Dark Cold Gradient */
            background: radial-gradient(circle at 50% -20%, #4c566a, #2e3440, #000000); 
            padding: 24px 12px 32px; 
            color: var(--dark-text); 
            overflow-x: hidden;
            position: relative;
        } 

        /* Fog Feature */
        .fog-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .fog-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: linear-gradient(to right, transparent 0%, rgba(136, 192, 208, 0.05) 25%, transparent 50%, rgba(136, 192, 208, 0.05) 75%, transparent 100%);
            animation: drift 60s linear infinite;
        }
        .fog-layer:nth-child(2) {
            animation-duration: 45s;
            animation-direction: reverse;
            background: linear-gradient(to right, transparent 0%, rgba(236, 239, 244, 0.03) 40%, transparent 100%);
        }

        @keyframes drift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Nature Feature: Forest Silhouette */
        .forest-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            background: linear-gradient(to top, #1a202c, transparent);
            z-index: 0;
        }
        .tree-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: #1a202c;
            /* Simple jagged pattern for trees */
            clip-path: polygon(
                0% 100%, 2% 60%, 4% 100%, 6% 40%, 8% 100%, 
                10% 50%, 12% 100%, 14% 30%, 16% 100%, 18% 70%, 20% 100%,
                22% 50%, 24% 100%, 26% 20%, 28% 100%, 30% 60%, 32% 100%,
                34% 40%, 36% 100%, 38% 80%, 40% 100%, 42% 50%, 44% 100%,
                46% 30%, 48% 100%, 50% 70%, 52% 100%, 54% 20%, 56% 100%,
                58% 60%, 60% 100%, 62% 40%, 64% 100%, 66% 80%, 68% 100%,
                70% 50%, 72% 100%, 74% 30%, 76% 100%, 78% 70%, 80% 100%,
                82% 20%, 84% 100%, 86% 60%, 88% 100%, 90% 40%, 92% 100%,
                94% 80%, 96% 100%, 98% 30%, 100% 100%
            );
            opacity: 0.8;
        }
        .tree-line.back {
            height: 150px;
            bottom: 0;
            opacity: 0.4;
            transform: scaleX(-1);
            filter: blur(2px);
        }

        .app-shell { 
            background: var(--glass-bg); 
            backdrop-filter: blur(10px); 
            border-radius: 26px; 
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4); 
            border: 1px solid var(--glass-border); 
            padding: 24px 18px 20px; 
            position: relative;
            z-index: 10;
        } 
 
        .fade-transition { transition: opacity 0.4s ease; } 
 
        /* WELCOME PAGE */ 
        #welcome-page { 
            min-height: 70vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        } 
 
        .welcome-tag { 
            letter-spacing: 0.25em; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            color: var(--cold-soft); 
        } 
 
        .welcome-title { 
            font-family: 'Roboto Mono', monospace; 
            font-size: 2.15rem; 
            font-weight: 700; 
            line-height: 1.2; 
            margin-top: 0.75rem; 
            margin-bottom: 0.3rem; 
            background: linear-gradient(135deg, #a3be8c, #88c0d0, #5e81ac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(136, 192, 208, 0.3);
        } 
 
        .welcome-sub { 
            font-size: 0.95rem; 
            color: #d8dee9; 
        } 
 
        #start-btn { 
            margin-top: 1.9rem; 
            padding: 0.9rem 3rem; 
            border-radius: 999px; 
            border: none; 
            font-weight: 700; 
            font-size: 0.9rem; 
            letter-spacing: 0.16em; 
            text-transform: uppercase; 
            cursor: pointer; 
            background-image: linear-gradient(135deg, #5e81ac 0%, #88c0d0 100%); 
            background-size: 200% auto; 
            color: white; 
            box-shadow: 0 10px 25px rgba(94, 129, 172, 0.4); 
            transition: 
                background-position 0.4s ease, 
                transform 0.16s ease, 
                box-shadow 0.16s ease; 
        } 
 
        #start-btn:hover { 
            background-position: right center; 
            transform: translateY(-1px); 
            box-shadow: 0 14px 30px rgba(94, 129, 172, 0.5); 
        } 
 
        #start-btn:active { 
            transform: translateY(1px) scale(0.98); 
            box-shadow: 0 6px 16px rgba(94, 129, 172, 0.45); 
        } 
 
        /* MAIN HEADER */ 
        .main-header { 
            text-align: center; 
            margin-bottom: 0.9rem; 
            position: relative; 
            z-index: 10; 
        } 
 
        .main-pill { 
            display: inline-flex; 
            align-items: center; 
            gap: 0.35rem; 
            font-size: 0.72rem; 
            text-transform: uppercase; 
            letter-spacing: 0.18em; 
            padding: 0.32rem 0.9rem; 
            border-radius: 999px; 
            background: rgba(136, 192, 208, 0.15); 
            border: 1px solid rgba(136, 192, 208, 0.3); 
            color: #88c0d0; 
            margin-bottom: 0.5rem; 
        } 
 
        .main-title { 
            font-family: 'Roboto Mono', monospace; 
            font-size: 1.55rem; 
            font-weight: 700; 
            color: #eceff4; 
        } 
 
        .daily-affirmation { 
            font-family: 'Poppins', sans-serif; 
            font-size: 0.9rem; 
            color: #d8dee9; 
            font-style: italic; 
            margin: 0.2rem auto 0.5rem; 
            max-width: 80%; 
            line-height: 1.4; 
        } 
 
        .datetime-wrapper { 
            display: flex; 
            justify-content: center; 
            margin-top: 0.4rem; 
            margin-bottom: 1rem; 
        } 
 
        .datetime { 
            font-size: 0.8rem; 
            color: #2e3440; 
            font-weight: 500; 
            background: #88c0d0; 
            border-radius: 999px; 
            padding: 0.43rem 1.2rem; 
            display: inline-flex; 
            align-items: center; 
            gap: 0.35rem; 
            box-shadow: 0 0 10px rgba(136, 192, 208, 0.3);
        } 
 
        .clock-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 999px; 
            background: #2e3440; 
            box-shadow: 0 0 0 2px rgba(46, 52, 64, 0.25); 
        } 
 
        .top-actions { 
            display: flex; 
            justify-content: flex-start; 
            align-items: center; 
            gap: 0.5rem; 
            margin-bottom: 0.6rem; 
            flex-wrap: wrap; 
        } 
 
        .info-text { 
            font-size: 0.78rem; 
            color: #81a1c1; 
            display: flex; 
            align-items: center; 
            gap: 0.35rem; 
        } 
 
        .info-dot { 
            width: 6px; 
            height: 6px; 
            border-radius: 999px; 
            background: var(--cold-soft); 
        } 
 
        /* TOMBOL EDIT USER DI POJOK KANAN ATAS (FIXED) */ 
        #edit-users-btn { 
            position: fixed; 
            top: 12px; 
            right: 12px; 
            z-index: 50; 
            border-radius: 999px; 
            border: none; 
            padding: 0.5rem 1.1rem; 
            font-size: 0.78rem; 
            font-weight: 600; 
            color: #2e3440; 
            background: linear-gradient(135deg, #88c0d0, #81a1c1); 
            display: inline-flex; 
            align-items: center; 
            gap: 0.3rem; 
            cursor: pointer; 
            box-shadow: 0 7px 16px rgba(136, 192, 208, 0.3); 
        } 
 
        #edit-users-btn:hover { 
            filter: brightness(1.1); 
            transform: translateY(-1px); 
            box-shadow: 0 10px 20px rgba(136, 192, 208, 0.4); 
        } 
 
        .edit-btn-icon { 
            width: 16px; 
            height: 16px; 
            border-radius: 999px; 
            background: rgba(46, 52, 64, 0.3); 
            color: #eceff4; 
            font-size: 0.7rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        } 
 
        /* GRID USER */ 
        .users-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); 
            gap: 0.9rem; 
            margin-top: 0.6rem; 
            margin-bottom: 0.2rem; 
            max-height: calc(100vh - 270px); 
            overflow-y: auto; 
            padding-right: 4px; 
        } 
 
        .users-grid::-webkit-scrollbar { width: 6px; } 
        .users-grid::-webkit-scrollbar-track { 
            background: rgba(46, 52, 64, 0.5); 
            border-radius: 999px; 
        } 
        .users-grid::-webkit-scrollbar-thumb { 
            background: #4c566a; 
            border-radius: 999px; 
        } 
 
        /* KARTU USER – DESAIN + ANIMASI */ 
        .user-card { 
            position: relative; 
            border-radius: 18px; 
            padding: 0.75rem 0.8rem; 
            background: linear-gradient(145deg, rgba(59, 66, 82, 0.7), rgba(46, 52, 64, 0.8));
            border: 1px solid rgba(136, 192, 208, 0.1); 
            color: #eceff4; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            justify-content: space-between; 
            min-height: 86px; 
            overflow: hidden; 
 
            /* animasi utama */ 
            opacity: 0; 
            transform: translateY(18px) scale(0.97); 
            box-shadow: 0 9px 18px rgba(0, 0, 0, 0.2); 
            transition: transform 0.16s ease, box-shadow 0.16s ease; 
 
            animation-name: popIn, floatGlow; 
            animation-duration: 0.45s, 3.2s; 
            animation-timing-function: ease, ease-in-out; 
            animation-fill-mode: forwards, both; 
            animation-iteration-count: 1, infinite; 
            animation-delay: var(--stagger, 0s), 0.6s; 
        } 
 
        .user-card::before { 
            content: ""; 
            position: absolute; 
            width: 120%; 
            height: 120%; 
            top: -60%; 
            right: -40%; 
            background: radial-gradient(circle, rgba(136, 192, 208, 0.1), transparent 60%); 
            opacity: 0.5; 
            pointer-events: none; 
        } 
 
        /* RIPPLE CLICK */ 
        .user-card::after { 
            content: ""; 
            position: absolute; 
            left: 50%; 
            top: 50%; 
            width: 10px; 
            height: 10px; 
            background: rgba(255,255,255,0.3); 
            border-radius: 999px; 
            transform: translate(-50%, -50%) scale(0); 
            opacity: 0; 
            pointer-events: none; 
        } 
 
        .user-card:active::after { 
            animation: ripple 0.5s ease-out; 
        } 
 
        /* HOVER GLOW & WOBBLE */ 
        .user-card:hover { 
            transform: translateY(-3px) scale(1.01); 
            box-shadow: 
                0 13px 26px rgba(0, 0, 0, 0.3), 
                0 0 18px rgba(136, 192, 208, 0.15);
            animation: wobble 1s ease-in-out infinite;
            border-color: rgba(136, 192, 208, 0.4);
        }
        
        @keyframes wobble {
            0%, 100% { transform: translateY(-3px) rotate(0deg); }
            25% { transform: translateY(-3px) rotate(-1deg); }
            75% { transform: translateY(-3px) rotate(1deg); }
        }
 
        .user-card:active { 
            transform: translateY(1px) scale(0.99); 
            box-shadow: 0 6px 13px rgba(0, 0, 0, 0.2); 
        } 
 
        .user-card-header { 
            display: flex; 
            width: 100%; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 0.2rem; 
        } 
 
        .user-badge { 
            width: 32px; 
            height: 32px; 
            border-radius: 999px; 
            background: rgba(46, 52, 64, 0.8); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.7rem; 
            font-weight: 700; 
            color: #88c0d0; 
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); 
        } 
 
        .user-name { 
            font-weight: 700; 
            font-size: 0.95rem; 
            max-width: 80px; 
            overflow: hidden; 
            white-space: nowrap; 
            text-overflow: ellipsis; 
            color: #eceff4;
        } 
 
        .user-sub { 
            font-size: 0.7rem; 
            color: #81a1c1; 
            opacity: 0.9; 
        } 
 
        .user-pill { 
            margin-top: 0.3rem; 
            font-size: 0.7rem; 
            padding: 0.2rem 0.55rem; 
            border-radius: 999px; 
            border: 1px dashed rgba(136, 192, 208, 0.4); 
            background: linear-gradient(90deg, rgba(46, 52, 64, 0.65), rgba(46, 52, 64, 0.35)); 
            display: inline-flex; 
            align-items: center; 
            gap: 0.3rem; 
        } 
 
        .user-pill-dot { 
            width: 7px; 
            height: 7px; 
            border-radius: 999px; 
            background: #a3be8c; 
        } 
 
        .footer-note { 
            margin-top: 0.5rem; 
            font-size: 0.72rem; 
            text-align: center; 
            color: #81a1c1; 
        } 
 
        /* EDIT PANEL */ 
        .edit-panel-backdrop { 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.7); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 60; 
            backdrop-filter: blur(5px);
        } 
 
        .edit-panel-backdrop.show { display: flex; } 
 
        .edit-panel { 
            width: 100%; 
            max-width: 420px; 
            background: #2e3440; 
            border-radius: 20px; 
            border: 1px solid #4c566a; 
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5); 
            padding: 16px 16px 14px; 
        } 
 
        .edit-panel-title { 
            font-size: 1rem; 
            font-weight: 700; 
            color: #eceff4; 
            margin-bottom: 0.2rem; 
        } 
 
        .edit-panel-sub { 
            font-size: 0.8rem; 
            color: #81a1c1; 
            margin-bottom: 0.7rem; 
        } 
 
        .edit-users-list { 
            max-height: 260px; 
            overflow-y: auto; 
            padding-right: 4px; 
            margin-bottom: 0.7rem; 
        } 
 
        .edit-users-list::-webkit-scrollbar { width: 6px; } 
        .edit-users-list::-webkit-scrollbar-thumb { 
            background: #4c566a; 
            border-radius: 999px; 
        } 
 
        .edit-row { 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            margin-bottom: 0.45rem; 
        } 
 
        .edit-label { 
            font-size: 0.78rem; 
            font-weight: 600; 
            color: #d8dee9; 
            width: 68px; 
            flex-shrink: 0; 
        } 
 
        .edit-input { 
            flex: 1; 
            border-radius: 999px; 
            border: 1px solid #4c566a; 
            padding: 0.32rem 0.7rem; 
            font-size: 0.8rem; 
            outline: none; 
            background: #3b4252; 
            color: #eceff4;
        } 
 
        .edit-input:focus { 
            border-color: #88c0d0; 
            box-shadow: 0 0 0 2px rgba(136, 192, 208, 0.2); 
        } 
 
        .edit-actions { 
            display: flex; 
            justify-content: flex-end; 
            gap: 0.5rem; 
            margin-top: 0.1rem; 
        } 
 
        .btn-ghost { 
            border-radius: 999px; 
            border: 1px solid #4c566a; 
            background: transparent; 
            padding: 0.35rem 0.9rem; 
            font-size: 0.8rem; 
            cursor: pointer; 
            color: #d8dee9; 
        } 
 
        .btn-primary { 
            border-radius: 999px; 
            border: none; 
            background: linear-gradient(135deg, #5e81ac, #81a1c1); 
            padding: 0.38rem 1.1rem; 
            font-size: 0.8rem; 
            cursor: pointer; 
            font-weight: 600; 
            color: #fff; 
            box-shadow: 0 7px 16px rgba(94, 129, 172, 0.4); 
        } 
 
        .btn-primary:hover { filter: brightness(1.1); } 
 
        /* MIST PARTICLES */ 
        .fairy-dust { 
            position: fixed; 
            pointer-events: none; 
            width: 6px; 
            height: 6px; 
            border-radius: 50%; 
            background: rgba(236, 239, 244, 0.8); 
            box-shadow: 0 0 5px rgba(136, 192, 208, 0.8), 0 0 10px rgba(136, 192, 208, 0.5); 
            animation: fadeOut 1s forwards; 
            z-index: 9999; 
        } 
 
        @keyframes fadeOut { 
            0% { transform: scale(1); opacity: 0.8; } 
            100% { transform: scale(0); opacity: 0; } 
        } 
 
        /* BACKGROUND FLOATING MIST ORBS */ 
        .floating-bubble { 
            position: absolute; 
            border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, rgba(236, 239, 244, 0.2), transparent 70%);
            box-shadow: 0 0 20px rgba(136, 192, 208, 0.1);
            z-index: 2; 
            animation: floatUp linear infinite; 
            cursor: pointer;
            border: none;
            filter: blur(2px);
        }

        .floating-bubble::after {
            display: none;
        }
 
        @keyframes floatUp { 
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; } 
            20% { opacity: 0.4; } 
            80% { opacity: 0.4; } 
            100% { transform: translateY(-10vh) scale(1); opacity: 0; } 
        } 

        @keyframes pop {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .bubble-pop {
            animation: pop 0.3s ease-out forwards !important;
        }
 
        /* ANIMASI KEYFRAMES */ 
        @keyframes popIn { 
            0% { 
                opacity: 0; 
                transform: translateY(18px) scale(0.9); 
            } 
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            } 
        } 
 
        @keyframes floatGlow { 
            0% { 
                box-shadow: 0 9px 18px rgba(0, 0, 0, 0.2); 
            } 
            50% { 
                box-shadow: 
                    0 12px 24px rgba(0, 0, 0, 0.3), 
                    0 0 14px rgba(136, 192, 208, 0.1); 
            } 
            100% { 
                box-shadow: 0 9px 18px rgba(0, 0, 0, 0.2); 
            } 
        } 
 
        @keyframes ripple { 
            0% { 
                transform: translate(-50%, -50%) scale(0); 
                opacity: 0.7; 
            } 
            100% { 
                transform: translate(-50%, -50%) scale(18); 
                opacity: 0; 
            } 
        } 
 
        @media (max-width: 640px) { 
            .app-shell { padding: 20px 14px 18px; } 
            .welcome-title { font-size: 1.8rem; } 
            .main-title { font-size: 1.35rem; } 
        } 
    </style> 
</head> 
<body> 
    <!-- Tombol Edit User di pojok kanan atas --> 
    <button id="edit-users-btn" type="button"> 
        <span class="edit-btn-icon">✎</span> 
        <span>Edit Nama User</span> 
    </button> 
 
    <!-- Fog Layers -->
    <div class="fog-container">
        <div class="fog-layer"></div>
        <div class="fog-layer"></div>
    </div>
    
    <!-- Nature Feature -->
    <div class="forest-bg">
        <div class="tree-line back"></div>
        <div class="tree-line"></div>
    </div>

    <div class="max-w-md mx-auto app-shell"> 
        <!-- WELCOME PAGE --> 
        <div id="welcome-page" class="fade-transition" style="opacity: 1;"> 
            <div class="welcome-tag">WELCOME TO</div> 
            <h1 class="welcome-title">Acorn Consultant<br>LBS 2026 Project</h1> 
            <p class="welcome-sub"> 
                LBS 2026 Project • Akses survey terorganisir untuk setiap user. 
            </p> 
            <button id="start-btn">PRESS START TO CONTINUE</button> 
        </div> 
 
        <!-- MAIN VIEW --> 
        <div id="main-view" class="fade-transition" style="display:none; opacity:0;"> 
            <div class="main-header"> 
                <div class="main-pill"> 
                    <span>LBS 2026 Project</span> 
                </div> 
                <h1 class="main-title">User Survey Panel</h1> 
                <div id="daily-affirmation" class="daily-affirmation"></div> 
                <div class="datetime-wrapper"> 
                    <div class="datetime"> 
                        <span class="clock-dot"></span> 
                        <span id="datetime-text"></span> 
                    </div> 
                </div> 
            </div> 
 
            <div class="top-actions"> 
                <div class="info-text"> 
                    <span class="info-dot"></span> 
                    <span>Tap kartu user untuk membuka link survey</span> 
                </div> 
            </div> 
 
            <div id="users-grid" class="users-grid"></div> 
 
            <div class="footer-note"> 
                Good luck!!!. 
            </div> 
        </div> 
    </div> 
 
    <!-- MODAL EDIT NAMA USER --> 
    <div id="edit-panel-backdrop" class="edit-panel-backdrop"> 
        <div class="edit-panel"> 
            <div class="edit-panel-title">Edit Nama User</div> 
            <div class="edit-panel-sub"> 
                Gunakan untuk mengganti label <strong>User 1 – User 10</strong> sesuai kebutuhan. 
            </div> 
            <div id="edit-users-list" class="edit-users-list"></div> 
            <div class="edit-actions"> 
                <button id="edit-cancel" class="btn-ghost" type="button">Batal</button> 
                <button id="edit-save" class="btn-primary" type="button">Simpan</button> 
            </div> 
        </div> 
    </div> 
 
    <script> 
        document.addEventListener('DOMContentLoaded', () => { 
            const SURVEY_LINK = "https://emea.focusvision.com/survey/selfserve/47fa/260208?decLang=indonesian"; 
            const PASSWORD_EDIT = "Aco123"; 
 
            const welcomePage = document.getElementById('welcome-page'); 
            const startBtn = document.getElementById('start-btn'); 
            const mainView = document.getElementById('main-view'); 
            const usersGrid = document.getElementById('users-grid'); 
            const datetimeText = document.getElementById('datetime-text'); 
 
            const editBtn = document.getElementById('edit-users-btn'); 
            const editBackdrop = document.getElementById('edit-panel-backdrop'); 
            const editUsersList = document.getElementById('edit-users-list'); 
            const editCancel = document.getElementById('edit-cancel'); 
            const editSave = document.getElementById('edit-save'); 
 
            // Data user default 
            const users = []; 
            const defaultNames = [ 
                "TAB 1", "TAB 2", "TAB 3", "TAB 4", "TAB 5", "TAB 6", "TAB 7", "TAB 8", "TAB 9", "TAB 10", "TAB 11", "TAB 12", "TAB 13", "TAB 14", "Bakcup TAB 1", "Backup TAB 2" 
            ]; 
 
            for (let i = 0; i < 10; i++) { 
                const id = `user${String(i + 1).padStart(2, '0')}`; 
                users.push({ 
                    id, 
                    name: defaultNames[i] 
                }); 
            } 
 
            // Load custom nama dari localStorage (v2 to reset defaults) 
            const storedNames = JSON.parse(localStorage.getItem('ShankaraUserNames_v2') || '{}'); 
            if (storedNames && typeof storedNames === 'object') { 
                users.forEach(u => { 
                    if (storedNames[u.id]) { 
                        u.name = storedNames[u.id]; 
                    } 
                }); 
            } 
 
            // Render kartu user 
            function renderUserGrid() { 
                usersGrid.innerHTML = ''; 
                users.forEach((user, index) => { 
                    const btn = document.createElement('button'); 
                    btn.type = 'button'; 
                    btn.className = 'user-card'; 
                    btn.style.setProperty('--stagger', (index * 0.08) + 's'); 
 
                    btn.innerHTML = ` 
                        <div class="user-card-header"> 
                            <div class="user-badge">#${index + 1}</div> 
                            <div style="text-align:right;"> 
                                <div class="user-name" title="${user.name}">${user.name}</div> 
                                <div class="user-sub">Survey LBS 2026</div> 
                            </div> 
                        </div> 
                        <div class="user-pill"> 
                            <span class="user-pill-dot"></span> 
                            <span>Buka link survey</span> 
                        </div> 
                    `; 
 
                    btn.addEventListener('click', () => { 
                        window.open(SURVEY_LINK, '_blank', 'noopener,noreferrer'); 
                    }); 
 
                    usersGrid.appendChild(btn); 
                }); 
            } 
 
            // Update datetime (Asia/Jakarta) 
            function updateDateTime() { 
                const now = new Date(); 
                const options = { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric', 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit', 
                    timeZone: 'Asia/Jakarta' 
                }; 
                datetimeText.textContent = now.toLocaleString('id-ID', options); 
            } 
 
            // Transisi dari welcome ke main 
            startBtn.addEventListener('click', () => { 
                // Confetti Explosion (Updated Colors)
                const duration = 2000; 
                const end = Date.now() + duration; 
 
                (function frame() { 
                    confetti({ 
                        particleCount: 7, 
                        angle: 60, 
                        spread: 55, 
                        origin: { x: 0 }, 
                        colors: ['#88c0d0', '#eceff4', '#5e81ac'] 
                    }); 
                    confetti({ 
                        particleCount: 7, 
                        angle: 120, 
                        spread: 55, 
                        origin: { x: 1 }, 
                        colors: ['#88c0d0', '#eceff4', '#5e81ac'] 
                    }); 
 
                    if (Date.now() < end) { 
                        requestAnimationFrame(frame); 
                    } 
                }()); 
 
                setTimeout(() => { 
                    confetti({ 
                        particleCount: 100, 
                        spread: 100, 
                        origin: { y: 0.6 }, 
                        colors: ['#88c0d0', '#eceff4', '#81a1c1'] 
                    }); 
                }, 300); 
 
                welcomePage.style.opacity = '0'; 
                setTimeout(() => { 
                    welcomePage.style.display = 'none'; 
                    mainView.style.display = 'block'; 
                    requestAnimationFrame(() => { 
                        mainView.style.opacity = '1'; 
                    }); 
                }, 400); 
            }); 
 
            // Buka panel edit (dengan password) 
            editBtn.addEventListener('click', () => { 
                const pwd = prompt('Masukkan password untuk mengedit nama user:'); 
                if (pwd === null) return; 
                if (pwd !== PASSWORD_EDIT) { 
                    alert('Password salah.'); 
                    return; 
                } 
                openEditPanel(); 
            }); 
 
            function openEditPanel() { 
                editUsersList.innerHTML = ''; 
                users.forEach((user, index) => { 
                    const row = document.createElement('div'); 
                    row.className = 'edit-row'; 
                    row.innerHTML = ` 
                        <div class="edit-label">User ${index + 1}</div> 
                        <input 
                            type="text" 
                            class="edit-input" 
                            data-id="${user.id}" 
                            value="${user.name}" 
                            maxlength="30" 
                        /> 
                    `; 
                    editUsersList.appendChild(row); 
                }); 
                editBackdrop.classList.add('show'); 
            } 
 
            editCancel.addEventListener('click', () => { 
                editBackdrop.classList.remove('show'); 
            }); 
 
            editSave.addEventListener('click', () => { 
                const inputs = editUsersList.querySelectorAll('.edit-input'); 
                const newNames = {}; 
                inputs.forEach(input => { 
                    const id = input.getAttribute('data-id'); 
                    let value = input.value.trim(); 
                    if (!value) { 
                        const index = users.findIndex(u => u.id === id); 
                        value = defaultNames[index]; 
                        input.value = value; 
                    } 
                    newNames[id] = value; 
                }); 
 
                localStorage.setItem('ShankaraUserNames_v2', JSON.stringify(newNames)); 
                users.forEach(u => { 
                    if (newNames[u.id]) { 
                        u.name = newNames[u.id]; 
                    } 
                }); 
 
                renderUserGrid(); 
                editBackdrop.classList.remove('show'); 
            }); 
 
            // Tutup panel kalau klik di luar box 
            editBackdrop.addEventListener('click', (e) => { 
                if (e.target === editBackdrop) { 
                    editBackdrop.classList.remove('show'); 
                } 
            }); 
 
            // Daily Affirmations 
            const affirmations = [ 
                "You are capable of amazing things.", 
                "Your potential is endless.", 
                "Radiate positivity today.", 
                "You are strong, confident, and unstoppable.", 
                "Believe in yourself and all that you are.", 
                "Today is a beautiful day to be alive.", 
                "You are enough, just as you are.", 
                "Embrace the magic within you.", 
                "Your smile lights up the world.", 
                "You are creating a life you love." 
            ]; 
 
            function setDailyAffirmation() { 
                const affirmationEl = document.getElementById('daily-affirmation'); 
                const randomAffirmation = affirmations[Math.floor(Math.random() * affirmations.length)]; 
                affirmationEl.textContent = `“${randomAffirmation}”`; 
            } 
 
            // Fairy Dust Cursor (Mist Particles)
            document.addEventListener('mousemove', (e) => { 
                const dust = document.createElement('div'); 
                dust.classList.add('fairy-dust'); 
                dust.style.left = e.pageX + 'px'; 
                dust.style.top = e.pageY + 'px'; 
                 
                // Randomize color slightly (Cold tones)
                const colors = ['#88c0d0', '#eceff4', '#81a1c1']; 
                dust.style.background = colors[Math.floor(Math.random() * colors.length)]; 
                 
                document.body.appendChild(dust); 
                 
                setTimeout(() => { 
                    dust.remove(); 
                }, 1000); 
            }); 
 
            // Floating Bubbles Background (Mist Orbs)
            function createBubbles() { 
                const bubbleCount = 30; 
                for (let i = 0; i < bubbleCount; i++) { 
                    const bubble = document.createElement('div'); 
                    bubble.classList.add('floating-bubble'); 
                     
                    const size = Math.random() * 60 + 20; 
                    bubble.style.width = size + 'px'; 
                    bubble.style.height = size + 'px'; 
                     
                    bubble.style.left = Math.random() * 100 + 'vw'; 
                    bubble.style.animationDuration = (Math.random() * 10 + 10) + 's'; 
                    bubble.style.animationDelay = (Math.random() * 5) + 's'; 
                     
                    // Interactive Pop
                    bubble.addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        bubble.classList.add('bubble-pop');
                        setTimeout(() => {
                            bubble.remove();
                        }, 300);
                    });

                    document.body.appendChild(bubble); 
                } 
            } 
 
            // Inisialisasi 
            renderUserGrid(); 
            updateDateTime(); 
            setDailyAffirmation(); 
            createBubbles(); 
            setInterval(updateDateTime, 1000); 
        }); 
    </script> 
</body>
